name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC 13, headless subset)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ \
            libglfw3-dev libvulkan-dev libopenal-dev libuv1-dev
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux
      - name: Test
        run: ctest --preset linux

  linux-sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ \
            libglfw3-dev libvulkan-dev libopenal-dev libuv1-dev
      - name: Configure
        run: cmake --preset linux-asan
      - name: Build
        run: cmake --build --preset linux-asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: ctest --preset linux-asan

  check-deps:
    name: Workspace dependency rule
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends powershell
      - name: Run check_deps
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File tools/check_deps.ps1 -Root "$PWD"

  android:
    name: Android NDK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake
      - name: Verify NDK toolchain
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
      - name: Configure
        run: cmake --preset android
      - name: Build
        run: cmake --build --preset android
