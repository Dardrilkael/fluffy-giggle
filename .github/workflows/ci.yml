name: CI

on:
  pull_request:
    branches: [main]
  # Called by build.yml on version tags so a release cannot be published
  # without the regression tests passing.
  workflow_call:
    inputs:
      tests-only:
        description: "Run only the test jobs (the release workflow builds the artifacts itself)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, UI and Circsim regressions)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ \
            libglfw3-dev libvulkan-dev libopenal-dev libuv1-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev

      - name: Configure
        run: cmake --preset linux

      - name: Build application and maintained test targets
        run: |
          cmake --build --preset linux --target \
            circsim_editor test_circsim test_physics test_ui_canvas \
            test_circsim_editor_document test_circsim_editor_canvas \
            test_circsim_editor_canvas_cost test_circsim_editor_panel \
            test_circsim_editor_side_panels test_circsim_editor_waveform_prof

      - name: Run maintained regression tests
        run: |
          build/linux/bin/test_circsim
          build/linux/bin/test_physics
          build/linux/bin/test_ui_canvas
          build/linux/bin/test_circsim_editor_document
          build/linux/bin/test_circsim_editor_canvas
          build/linux/bin/test_circsim_editor_canvas_cost
          build/linux/bin/test_circsim_editor_panel \
            --test-case="an idle frame reuses the cached decimation verbatim"
          build/linux/bin/test_circsim_editor_side_panels \
            --test-case="long directive rows keep their complete text in the edit buffer"
          build/linux/bin/test_circsim_editor_side_panels \
            --test-case="stale problem locations cannot be navigated after an edit"
          build/linux/bin/test_circsim_editor_waveform_prof

      - name: Exercise waveform profiler join modes
        shell: bash
        run: |
          test_bin=build/linux/bin/test_circsim_editor_waveform_prof
          CIRCSIM_PLOT_PROF=1 CIRCSIM_PLOT_JOIN=round "$test_bin" --test-case="waveform render profiling - round joins"
          CIRCSIM_PLOT_PROF=1 CIRCSIM_PLOT_JOIN=bevel "$test_bin" --test-case="waveform render profiling - bevel joins"
          CIRCSIM_PLOT_PROF=1 CIRCSIM_PLOT_JOIN=miter "$test_bin" --test-case="waveform render profiling - miter joins"
          CIRCSIM_PLOT_PROF=2 CIRCSIM_PLOT_JOIN=round "$test_bin" --test-case="waveform render profiling - round joins PROF=2"
          CIRCSIM_PLOT_PROF=2 CIRCSIM_PLOT_JOIN=bevel "$test_bin" --test-case="waveform render profiling - bevel joins PROF=2"
          CIRCSIM_PLOT_PROF=2 CIRCSIM_PLOT_JOIN=miter "$test_bin" --test-case="waveform render profiling - miter joins PROF=2"

  linux-sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ \
            libglfw3-dev libvulkan-dev libopenal-dev libuv1-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev

      - name: Configure
        run: cmake --preset linux-asan

      - name: Build maintained sanitizer targets
        run: |
          cmake --build --preset linux-asan --target \
            circsim_editor test_physics test_ui_canvas \
            test_circsim_editor_document test_circsim_editor_canvas test_circsim_editor_canvas_cost test_circsim_editor_panel \
            test_circsim_editor_side_panels test_circsim_editor_waveform_prof

      # Build this target in its own invocation as a guard: it must
      # produce the executable that the sanitizer test step runs below.
      - name: Build canvas regression under sanitizers
        run: cmake --build --preset linux-asan --target test_circsim_editor_canvas --parallel 2

      - name: Run maintained sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: |
          build/linux-asan/bin/test_circsim
          build/linux-asan/bin/test_physics
          build/linux-asan/bin/test_ui_canvas
          build/linux-asan/bin/test_circsim_editor_document
          build/linux-asan/bin/test_circsim_editor_canvas
          build/linux-asan/bin/test_circsim_editor_canvas_cost
          build/linux-asan/bin/test_circsim_editor_panel \
            --test-case="an idle frame reuses the cached decimation verbatim"
          build/linux-asan/bin/test_circsim_editor_side_panels \
            --test-case="long directive rows keep their complete text in the edit buffer"
          build/linux-asan/bin/test_circsim_editor_side_panels \
            --test-case="stale problem locations cannot be navigated after an edit"
          build/linux-asan/bin/test_circsim_editor_waveform_prof

  check-deps:
    name: Workspace dependency rule
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pwsh is preinstalled on the GitHub-hosted runner images.
      - name: Run check_deps
        shell: bash
        run: pwsh -NoProfile -File tools/check_deps.ps1 -Root "$PWD"

  # ---- build-only checks for what release builds produce (skipped when the
  # ---- release workflow calls this file with tests-only: true) -------------

  linux-release:
    if: ${{ inputs.tests-only != true }}
    name: Linux x86_64 (Release build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ \
            libglfw3-dev libvulkan-dev libopenal-dev libuv1-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev

      # Keep these flags identical to the "linux" job in build.yml.
      - name: Configure Release
        run: cmake --preset linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-error=maybe-uninitialized"

      - name: Build circsim_editor
        run: cmake --build --preset linux --target circsim_editor --parallel 2

  windows:
    if: ${{ inputs.tests-only != true }}
    name: Windows x64 (Release build)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure Windows Release
        run: cmake --preset release

      - name: Build Windows executable
        run: cmake --build --preset release --target circsim_editor --parallel 2

  # Runs the real packaging script (debug-signed) so manifest, aapt2, d8,
  # zipalign and signing problems show up on the PR, not after the merge.
  android:
    if: ${{ inputs.tests-only != true }}
    name: Android arm64 (APK packaging)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK packages
        shell: pwsh
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }
          $ndk = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018"
          if (-not (Test-Path (Join-Path $ndk "build\cmake\android.toolchain.cmake"))) {
            throw "Android NDK toolchain not found at $ndk"
          }
          "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Android APK (debug key)
        shell: pwsh
        run: ./tools/package-android.ps1 -App circsim_editor
